name: Feature request
description: Propose a focused product improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Does this change a sensitive boundary?
      options:
        - No
        - Data source or RPC allowlist
        - Executable trust or process launch
        - Storage or privacy
        - Signing, sandbox, or permissions
        - Third-party dependency
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
